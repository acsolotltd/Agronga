{% load money %}
{# Section: price ticker. Context: products. Switches with the ₦ / $ toggle. #}
<section class="ticker" aria-label="Current prices">
  <div class="ticker-track">
    <ul>
      {% for p in products %}<li><a href="{{ p.get_absolute_url }}">{{ p.name }} {% price p %} <span class="u">{{ p.unit }}</span></a></li>{% endfor %}
    </ul>
    <ul aria-hidden="true">
      {% for p in products %}<li><a href="{{ p.get_absolute_url }}" tabindex="-1">{{ p.name }} {% price p %} <span class="u">{{ p.unit }}</span></a></li>{% endfor %}
    </ul>
  </div>
</section>
