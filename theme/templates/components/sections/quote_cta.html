{# Section: quote request. Context: form (QuoteForm). #}
<section class="cta section" id="quote" aria-labelledby="quote-title">
  <div class="wrap cta-grid">
    <div class="cta-copy reveal">
      <h2 id="quote-title">Need a quote for bulk or export?</h2>
      <p>Tell us the product, the quantity and where it is going. We reply by email with price, availability and delivery details.</p>
      <div class="cta-contact">
        <a href="tel:{{ company.phone_href }}"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>{{ company.phone }}</a>
        <a href="{% url 'core:contact' %}" data-email data-user="{{ company.email_user }}" data-domain="{{ company.email_domain }}"><svg class="i" aria-hidden="true"><use href="#i-mail"/></svg><span>Message us</span></a>
      </div>
    </div>
    <div class="formcard reveal">
      {% include "landing/partials/quote_form.html" %}
    </div>
  </div>
</section>
